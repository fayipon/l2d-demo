name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued runs supersede each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project01/package-lock.json
      - run: npm ci
      - run: npm run build

      # The published site is two things: the repository's landing page at the
      # root, and the app one level down. site/ is hand-written static files, so
      # assembling is a copy rather than a second install and a second build.
      # The layout here is the one project01's `base` (/l2d-demo/project01/)
      # assumes -- change one and the other stops resolving.
      - name: Assemble the site
        working-directory: .
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r project01/dist _site/project01

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
