name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued runs supersede each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            project01/package-lock.json
            tools/l2d-viewer/package-lock.json
            tools/sprite-bench/package-lock.json
      - run: npm ci
      - run: npm run build

      # The bench ships too, and its build is also its only type check -- it has
      # no other CI. Its dist is 2.2 MB because it borrows the game's models
      # rather than copying them; see tools/l2d-viewer/vite.config.ts.
      - name: Build the Live2D bench
        working-directory: tools/l2d-viewer
        run: |
          npm ci
          npm run build

      # The sprite bench, same deal: its build is its only type check. It does
      # not borrow anything from project01 -- the one game file it can open is
      # dev-only, served by middleware -- so its dist is itself plus Phaser.
      - name: Build the sprite bench
        working-directory: tools/sprite-bench
        run: |
          npm ci
          npm run build

      # The published site is three things: the repository's landing page at the
      # root, and one directory per project under it. site/ is hand-written
      # static files, so assembling is a copy rather than a third install and a
      # third build. The layout here is the one each project's `base` assumes --
      # change one and the other stops resolving.
      - name: Assemble the site
        working-directory: .
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r project01/dist _site/project01
          cp -r tools/l2d-viewer/dist _site/l2d-viewer
          cp -r tools/sprite-bench/dist _site/sprite-bench

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
